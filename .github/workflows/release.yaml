name: release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release.yaml
      - pkg/**
      - go.*
      - VERSION
    tags:
      - v*
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/release.yaml
      - pkg/**
      - go.*
      - VERSION

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}--${{ github.ref }}

jobs:
  draft:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      release-name: ${{ steps.create-draft-release.outputs.release-name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'push'
        id: create-draft-release
        uses: int128/create-draft-release-action@276acfb78ac7493dc4090577478f860fad409830 # v0.3.0
        with:
          release-name-file: VERSION

  build:
    needs: draft
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-latest
            GOOS: linux
            GOARCH: amd64
            CGO_ENABLED: 0 # https://github.com/int128/kubelogin/issues/567
          - runs-on: ubuntu-latest
            GOOS: linux
            GOARCH: arm64
          - runs-on: ubuntu-latest
            GOOS: linux
            GOARCH: arm
          - runs-on: ubuntu-latest
            GOOS: linux
            GOARCH: ppc64le
          - runs-on: macos-latest
            GOOS: darwin
            GOARCH: amd64
            CGO_ENABLED: 1 # https://github.com/int128/kubelogin/issues/249
          - runs-on: macos-latest
            GOOS: darwin
            GOARCH: arm64
            CGO_ENABLED: 1 # https://github.com/int128/kubelogin/issues/762
          - runs-on: windows-latest
            GOOS: windows
            GOARCH: amd64
          - runs-on: windows-latest
            GOOS: windows
            GOARCH: arm64
    runs-on: ${{ matrix.platform.runs-on }}
    env:
      GOOS: ${{ matrix.platform.GOOS }}
      GOARCH: ${{ matrix.platform.GOARCH }}
      CGO_ENABLED: ${{ matrix.platform.CGO_ENABLED }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build
      - if: needs.draft.outputs.release-name
        uses: int128/go-release-action@9e1d6ec29fc6ffc2ba55f631baf4a73017d228e1 # v2.5.0
        with:
          binary: kubelogin
          release-name: ${{ needs.draft.outputs.release-name }}

  create-next-release-pr:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        run: |
          set -eux
          current_version="$(cat VERSION)"
          IFS='.' read -r major minor patch <<< "$current_version"
          new_version="${major}.${minor}.$((patch + 1))"
          echo "$new_version" > VERSION
      - if: github.event_name == 'push'
        uses: int128/update-generated-files-action@ffeee0fc8e9dc4718c1f36be68b9d89b2be28e51 # v2.109.0
